name: Build

on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/build.yml"
      - "CMakeLists.txt"
      - "rebar.config"
      - "c_src/**"
      - "include/**"
      - "src/**"
      - "test/**"
  pull_request:
    branches: ["master"]
    paths:
      - ".github/workflows/build.yml"
      - "CMakeLists.txt"
      - "rebar.config"
      - "c_src/**"
      - "include/**"
      - "src/**"
      - "test/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "build-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  ubuntu:
    name: Ubuntu OTP ${{ matrix.otp }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        otp: [27, 28, 29]
    steps:
      - name: Check out the source code
        uses: actions/checkout@v4

      - name: Set up Erlang/OTP
        uses: erlangsters/setup-erlang-otp@v1
        with:
          erlang-version: ${{ matrix.otp }}
          install-rebar3: true

      - name: Compile the binding
        run: rebar3 compile

      - name: Run the regression tests
        run: rebar3 eunit

  alpine:
    name: Alpine 3.23 OTP 29
    runs-on: ubuntu-latest
    container: alpine:3.23
    timeout-minutes: 15
    steps:
      - name: Check out the source code
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: apk add --no-cache bash cmake g++ git make musl-dev ncurses-dev libstdc++ openssl

      - name: Set up Erlang/OTP
        uses: erlangsters/setup-erlang-otp@v1
        with:
          erlang-version: 29
          install-rebar3: true

      - name: Compile the binding
        run: rebar3 compile

      - name: Run the regression tests
        run: rebar3 eunit

  macos:
    name: macOS OTP 29
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Check out the source code
        uses: actions/checkout@v4

      - name: Set up Erlang/OTP
        uses: erlangsters/setup-erlang-otp@v1
        with:
          erlang-version: 29
          install-rebar3: true

      - name: Compile the binding
        run: rebar3 compile

      - name: Run the regression tests
        run: rebar3 eunit

  windows:
    name: Windows OTP 29
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out the source code
        uses: actions/checkout@v4

      - name: Set up Erlang/OTP
        uses: erlangsters/setup-erlang-otp@v1
        with:
          erlang-version: 29
          install-rebar3: true

      - name: Compile the binding
        run: rebar3 compile
        shell: pwsh

      - name: Run the regression tests
        run: rebar3 eunit
        shell: pwsh